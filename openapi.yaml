openapi: 3.1.0
info:
  title: AI Video Engine
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /jobs:
    post:
      tags:
      - jobs
      summary: Create Job
      operationId: create_job_jobs_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - jobs
      summary: List Jobs
      operationId: list_jobs_jobs_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/upload:
    post:
      tags:
      - jobs
      summary: Upload Job
      operationId: upload_job_jobs_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_job_jobs_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get Job
      operationId: get_job_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/retry:
    post:
      tags:
      - jobs
      summary: Retry Job
      operationId: retry_job_jobs__job_id__retry_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/stream:
    get:
      tags:
      - jobs
      summary: Stream Job Progress
      operationId: stream_job_progress_jobs__job_id__stream_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/cancel:
    post:
      tags:
      - jobs
      summary: Cancel Job
      operationId: cancel_job_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin:
    get:
      tags:
      - admin
      summary: Admin Dashboard
      operationId: admin_dashboard_admin_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /admin/jobs:
    get:
      tags:
      - admin
      summary: Admin Jobs
      operationId: admin_jobs_admin_jobs_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/jobs/{job_id}/assets:
    get:
      tags:
      - admin
      summary: Admin Job Assets
      operationId: admin_job_assets_admin_jobs__job_id__assets_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Admin Job Assets Admin Jobs  Job Id  Assets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/events:
    get:
      tags:
      - admin
      summary: Admin Events
      operationId: admin_events_admin_events_get
      parameters:
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Admin Events Admin Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/jobs/{job_id}/cleanup:
    delete:
      tags:
      - admin
      summary: Admin Job Cleanup
      operationId: admin_job_cleanup_admin_jobs__job_id__cleanup_delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Admin Job Cleanup Admin Jobs  Job Id  Cleanup Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_upload_job_jobs_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        pipeline_type:
          type: string
          title: Pipeline Type
          default: dubbing
        payload_json:
          type: string
          title: Payload Json
          default: '{}'
        metadata_json:
          type: string
          title: Metadata Json
          default: '{}'
      type: object
      required:
      - file
      title: Body_upload_job_jobs_upload_post
    CancelJobResponse:
      properties:
        id:
          type: string
          title: Id
        cancel_requested:
          type: boolean
          title: Cancel Requested
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - cancel_requested
      - status
      title: CancelJobResponse
    CreateJobRequest:
      properties:
        pipeline_type:
          type: string
          title: Pipeline Type
          default: dubbing
        source_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Sha256
        input_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Path
        input_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Uri
        source_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Key
        payload:
          additionalProperties: true
          type: object
          title: Payload
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        priority:
          anyOf:
          - type: integer
          - type: 'null'
          title: Priority
      type: object
      title: CreateJobRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/JobResponse'
          type: array
          title: Items
      type: object
      required:
      - items
      title: JobListResponse
    JobResponse:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          title: Status
        pipeline_type:
          type: string
          title: Pipeline Type
        priority:
          type: integer
          title: Priority
          default: 0
        payload:
          additionalProperties: true
          type: object
          title: Payload
        input_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Path
        input_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Uri
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
        source_sha256:
          type: string
          title: Source Sha256
        pid:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pid
        worker_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Worker Id
        lease_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Lease Expires At
        cancel_requested:
          type: boolean
          title: Cancel Requested
        attempt_count:
          type: integer
          title: Attempt Count
        progress:
          type: integer
          title: Progress
        step_index:
          type: integer
          title: Step Index
        total_steps:
          type: integer
          title: Total Steps
        current_step:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Step
        log:
          anyOf:
          - type: string
          - type: 'null'
          title: Log
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        error_detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error Detail
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        is_terminal:
          type: boolean
          title: Is Terminal
          default: false
        can_cancel:
          type: boolean
          title: Can Cancel
          default: false
        can_retry:
          type: boolean
          title: Can Retry
          default: false
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - status
      - pipeline_type
      - source_sha256
      - cancel_requested
      - attempt_count
      - progress
      - step_index
      - total_steps
      - created_at
      - updated_at
      title: JobResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
